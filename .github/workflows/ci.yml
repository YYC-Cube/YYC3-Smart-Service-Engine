name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  lint-and-format:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ✅ Run ESLint
        run: pnpm lint

      - name: 🎨 Check Prettier formatting
        run: pnpm format:check

  type-check:
    name: 🔷 TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔎 Run TypeScript check
        run: pnpm typecheck

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests with coverage
        run: pnpm test:coverage

      - name: 📊 Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 7

      - name: 💍 Generate coverage badge (optional)
        if: success()
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            echo "✅ Test coverage report uploaded"
            echo "📊 Coverage artifacts available for download"

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [test, type-check]
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚡ Build application
        id: build
        run: |
          echo "⏱️ Starting production build..."
          START_TIME=$(date +%s)
          
          pnpm build
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "✅ Build completed in ${DURATION} seconds"
          echo "build_time=${DURATION}" >> $GITHUB_OUTPUT

      - name: 📤 Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: |
            .next/
            public/
            package.json
            pnpm-lock.yaml
          retention-days: 7
          if-no-files-found: error

      - name: 📋 Build Summary
        if: always()
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: ${{ steps.build.outputs.build_time }} seconds" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  ci-success:
    name: ✅ CI Success Notification
    needs: [build]
    if: success()
    runs-on: ubuntu-latest
    
    steps:
      - name: 🎉 CI Pipeline Completed
        run: |
          echo "✅ All CI checks passed!"
          echo ""
          echo "📦 Artifacts ready:"
          echo "   - Coverage Report: coverage-report-${{ github.sha }}"
          echo "   - Build Output: nextjs-build-${{ github.sha }}"
          echo ""
          echo "🌐 Ready for deployment to: https://sse.yyc3.top"

  ci-failure:
    name: ❌ CI Failure Alert
    needs: [build]
    if: failure()
    runs-on: ubuntu-latest
    
    steps:
      - name: ❌ CI Pipeline Failed
        run: |
          echo "::error::❌ CI Pipeline failed!"
          echo ""
          echo "Please check the failed jobs above and fix the issues."
          exit 1
